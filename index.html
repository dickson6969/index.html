<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森之帳本 - 溫馨記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <!-- Google API Libraries -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    <style>
        :root {
            --ghibli-green: #98ba7d;
            --ghibli-yellow: #f9e498;
            --ghibli-brown: #8d6e63;
            --ghibli-cream: #fdfaf1;
            --ghibli-sky: #aed9e0;
        }

        body {
            background-color: var(--ghibli-cream);
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--ghibli-brown);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(152, 186, 125, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(174, 217, 224, 0.2) 0%, transparent 25%);
            min-height: 100vh;
        }

        .cute-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }

        .card {
            background: white;
            border: 3px solid var(--ghibli-green);
            border-radius: 25px;
            box-shadow: 0 8px 0px rgba(152, 186, 125, 0.1);
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--ghibli-green);
            color: white;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: bold;
            box-shadow: 0 4px 0px #7a9a60;
            transition: all 0.1s;
        }

        .btn-google {
            background-color: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-google:hover {
            background-color: #f8f8f8;
            border-color: #ccc;
        }

        .btn-ai {
            background-color: #fce7f3;
            color: #be185d;
            border: 2px solid #f9a8d4;
            border-radius: 50px;
            padding: 4px 12px;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .input-field {
            border: 2px solid var(--ghibli-sky);
            border-radius: 12px;
            padding: 8px 12px;
            outline: none;
            width: 100%;
            background-color: white;
        }

        .summary-box {
            background: var(--ghibli-yellow);
            border: 2px dashed var(--ghibli-brown);
            border-radius: 20px;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .date-divider {
            display: flex;
            align-items: center;
            margin: 20px 0 10px;
            color: var(--ghibli-brown);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .date-divider::after {
            content: "";
            flex: 1;
            margin-left: 10px;
            height: 1px;
            background: rgba(141, 110, 99, 0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-md mx-auto relative">
        <!-- 設定按鈕 -->
        <button onclick="toggleSettings(true)" class="absolute top-0 right-0 p-2 text-gray-500 hover:text-green-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        </button>

        <div class="text-center mb-8">
            <h1 class="text-4xl cute-font text-green-700 mb-2">🌿 森之帳本 🌿</h1>
            <p class="text-sm opacity-75">記錄每一刻的溫暖生活</p>
        </div>

        <!-- 記帳卡片 -->
        <div class="card p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl cute-font">🍃 記下一筆花費</h2>
                <button id="aiSuggestBtn" onclick="askAiForSuggestion()" class="btn-ai flex items-center">✨ AI 建議</button>
            </div>
            
            <div id="aiMessageArea" class="hidden mb-4 p-3 bg-pink-50 border border-pink-100 rounded-xl text-xs text-pink-800 italic"></div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs mb-1 text-gray-500">日期</label>
                    <input type="date" id="entryDate" class="input-field text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs mb-1 text-gray-500">項目</label>
                        <select id="categorySelect" class="input-field bg-white text-sm" onchange="handleCategoryChange()"></select>
                    </div>
                    <div>
                        <label class="block text-xs mb-1 text-gray-500">項目預算</label>
                        <input type="number" id="currentBudgetDisplay" class="input-field text-sm" disabled>
                    </div>
                </div>

                <div>
                    <label class="block text-xs mb-1 text-gray-500">花費金額</label>
                    <input type="number" id="expenseInput" placeholder="請輸入花費金額" class="input-field">
                </div>

                <button onclick="addEntry()" class="w-full btn-primary text-lg mt-2">確認加入記帳本</button>
            </div>
        </div>

        <div id="entriesContainer" class="space-y-4 mb-8"></div>

        <div class="summary-box p-6 text-center shadow-inner">
            <h2 class="cute-font text-2xl mb-4">🌻 今日結算 🌻</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-600 uppercase tracking-widest">今日總支出</p>
                    <p id="totalExpense" class="text-2xl font-bold">$ 0</p>
                </div>
                <div>
                    <p class="text-xs text-gray-600 uppercase tracking-widest">今日總剩餘</p>
                    <p id="totalRemaining" class="text-2xl font-bold">$ 0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定中心彈窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
        <div class="card w-full max-w-sm p-5 relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleSettings(false)" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">✕</button>
            <h2 class="text-xl cute-font mb-4 text-green-700">⚙️ 設定中心</h2>
            
            <!-- Google 帳號串接區 -->
            <div class="mb-6 bg-blue-50 p-4 rounded-2xl border border-blue-100">
                <h3 class="text-sm font-bold mb-2 flex items-center gap-2">☁️ Google 試算表同步</h3>
                <div id="googleStatus" class="text-[10px] text-blue-600 mb-3 italic">尚未連結 Google 帳號</div>
                <div class="flex flex-col gap-2">
                    <button id="authorize_button" onclick="handleAuthClick()" class="btn-google">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4"> 連結 Google 帳號
                    </button>
                    <button id="sync_button" onclick="syncAllToSheet()" class="hidden btn-primary text-xs py-2 bg-blue-500 shadow-none border-none">
                        立即同步數據至試算表
                    </button>
                    <button id="signout_button" onclick="handleSignoutClick()" class="hidden text-[10px] text-gray-400 underline mt-1">登出 Google</button>
                </div>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">新增自定義項目</p>
                    <div class="flex gap-2">
                        <input type="text" id="newItemName" placeholder="名稱" class="flex-[1.5] input-field text-[11px] py-2 px-2">
                        <input type="number" id="newItemBudget" placeholder="預算" class="flex-1 input-field text-[11px] py-2 px-2">
                        <button onclick="addNewCategory()" class="btn-primary text-[11px] px-3 py-0 h-10 shrink-0">新增</button>
                    </div>
                </div>
                
                <div class="space-y-2">
                    <p class="text-[10px] text-gray-400 uppercase tracking-wider">現有預設清單</p>
                    <div id="categoryListContainer" class="max-h-40 overflow-y-auto text-sm space-y-2 pr-1"></div>
                </div>
            </div>

            <button onclick="toggleSettings(false)" class="w-full btn-primary mt-6 text-sm py-2">完成設定</button>
        </div>
    </div>

    <script>
        /**
         * 重要提示：
         * 已填入使用者提供的 CLIENT_ID 與 API_KEY。
         */
        const CLIENT_ID = '280549729141-o2fip1qnfv5a2pbpk7pdasep306t5s6h.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCJ6HWrynMRa75NnD3DIDIjXt1DoWgwe6I';
        
        const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let spreadsheetId = localStorage.getItem('ghibli_spreadsheet_id') || null;

        const geminiApiKey = ""; 
        const modelName = "gemini-2.5-flash-preview-09-2025";

        const defaultBudgets = { "🍞 早餐": 100, "🍱 午餐": 150, "🍲 晚餐": 200, "🍵 飲料": 60 };
        let budgetSettings = JSON.parse(localStorage.getItem('ghibli_budgets')) || defaultBudgets;
        let entries = JSON.parse(localStorage.getItem('ghibli_entries')) || [];

        window.onload = () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('entryDate').value = today;
            updateCategorySelect();
            handleCategoryChange();
            renderEntries();
            updateSummary();
        };

        // --- Google API 邏輯 ---
        function gapiLoaded() {
            if (typeof gapi !== 'undefined') {
                gapi.load('client', intializeGapiClient);
            }
        }
        
        async function intializeGapiClient() {
            try {
                if (!API_KEY) {
                    console.warn("Google API Key 未設定，試算表功能將無法運作。");
                    return;
                }
                await gapi.client.init({ apiKey: API_KEY, discoveryDocs: [DISCOVERY_DOC] });
                gapiInited = true;
                checkBeforeStart();
            } catch (err) {
                console.error("GAPI 初始化錯誤:", err);
            }
        }
        
        function gisLoaded() {
            if (typeof google !== 'undefined' && google.accounts) {
                if (!CLIENT_ID) {
                    console.warn("Google Client ID 未設定。");
                    return;
                }
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID, 
                    scope: SCOPES, 
                    callback: '', 
                });
                gisInited = true;
                checkBeforeStart();
            }
        }
        
        function checkBeforeStart() {
            if (gapiInited && gisInited && localStorage.getItem('google_access_token')) {
                const token = JSON.parse(localStorage.getItem('google_access_token'));
                if (token && gapi.client) {
                    gapi.client.setToken(token);
                    updateSigninStatus(true);
                }
            }
        }

        function handleAuthClick() {
            if (!tokenClient) {
                alert("Google API 尚未就緒，請稍候再試。");
                return;
            }
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                localStorage.setItem('google_access_token', JSON.stringify(gapi.client.getToken()));
                updateSigninStatus(true);
                await initializeSpreadsheet();
            };
            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                localStorage.removeItem('google_access_token');
                updateSigninStatus(false);
            }
        }

        function updateSigninStatus(isSignedIn) {
            const authBtn = document.getElementById('authorize_button');
            const signoutBtn = document.getElementById('signout_button');
            const syncBtn = document.getElementById('sync_button');
            const status = document.getElementById('googleStatus');

            if (isSignedIn) {
                if (authBtn) authBtn.classList.add('hidden');
                if (signoutBtn) signoutBtn.classList.remove('hidden');
                if (syncBtn) syncBtn.classList.remove('hidden');
                if (status) status.innerText = "✅ 已成功連結 Google 帳號";
            } else {
                if (authBtn) authBtn.classList.remove('hidden');
                if (signoutBtn) signoutBtn.classList.add('hidden');
                if (syncBtn) syncBtn.classList.add('hidden');
                if (status) status.innerText = "尚未連結 Google 帳號";
            }
        }

        async function initializeSpreadsheet() {
            if (spreadsheetId) return;
            try {
                const response = await gapi.client.sheets.spreadsheets.create({
                    resource: { properties: { title: '森之帳本_我的記帳數據' } }
                });
                spreadsheetId = response.result.spreadsheetId;
                localStorage.setItem('ghibli_spreadsheet_id', spreadsheetId);
                
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: spreadsheetId,
                    range: 'Sheet1!A1:D1',
                    valueInputOption: 'RAW',
                    resource: { values: [['日期', '項目', '預算', '花費']] }
                });
            } catch (err) { console.error("建立試算表錯誤:", err); }
        }

        async function syncAllToSheet() {
            if (!spreadsheetId) await initializeSpreadsheet();
            const btn = document.getElementById('sync_button');
            const originalText = btn.innerText;
            btn.innerText = "正在同步中...";
            try {
                const values = entries.map(e => [e.date, e.category, e.budget, e.expense]);
                await gapi.client.sheets.spreadsheets.values.clear({ spreadsheetId: spreadsheetId, range: 'Sheet1!A2:D1000' });
                if (values.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.append({
                        spreadsheetId: spreadsheetId,
                        range: 'Sheet1!A2',
                        valueInputOption: 'RAW',
                        resource: { values: values }
                    });
                }
                btn.innerText = "同步成功！";
                setTimeout(() => btn.innerText = originalText, 2000);
            } catch (err) { 
                console.error(err);
                btn.innerText = "同步失敗"; 
                setTimeout(() => btn.innerText = originalText, 2000);
            }
        }

        async function appendToSheet(entry) {
            if (!gapiInited || !gapi.client.getToken() || !spreadsheetId) return;
            try {
                await gapi.client.sheets.spreadsheets.values.append({
                    spreadsheetId: spreadsheetId,
                    range: 'Sheet1!A1',
                    valueInputOption: 'RAW',
                    resource: { values: [[entry.date, entry.category, entry.budget, entry.expense]] }
                });
            } catch (err) { console.warn("Google 自動同步失敗", err); }
        }

        // --- 記帳核心功能 ---
        function saveToLocalStorage() {
            localStorage.setItem('ghibli_budgets', JSON.stringify(budgetSettings));
            localStorage.setItem('ghibli_entries', JSON.stringify(entries));
        }

        function updateCategorySelect() {
            const select = document.getElementById('categorySelect');
            if (!select) return;
            const currentVal = select.value;
            select.innerHTML = '';
            Object.keys(budgetSettings).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = opt.text = cat;
                select.appendChild(opt);
            });
            if (budgetSettings[currentVal]) select.value = currentVal;
        }

        function handleCategoryChange() {
            const select = document.getElementById('categorySelect');
            const budgetDisplay = document.getElementById('currentBudgetDisplay');
            if (select && budgetDisplay) {
                budgetDisplay.value = budgetSettings[select.value] || 0;
            }
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if (show) {
                modal.classList.remove('hidden');
                renderCategoryList();
                if (gapiInited && gapi.client && gapi.client.getToken()) updateSigninStatus(true);
            } else {
                modal.classList.add('hidden');
                updateCategorySelect();
                handleCategoryChange();
                updateSummary();
                renderEntries();
            }
        }

        function addNewCategory() {
            const nameInput = document.getElementById('newItemName');
            const budgetInput = document.getElementById('newItemBudget');
            let name = nameInput.value.trim();
            let budget = parseFloat(budgetInput.value) || 0;
            if (!name) return;
            budgetSettings[name] = budget;
            saveToLocalStorage();
            nameInput.value = '';
            budgetInput.value = '';
            renderCategoryList();
            updateCategorySelect();
        }

        function addEntry() {
            const date = document.getElementById('entryDate').value;
            const category = document.getElementById('categorySelect').value;
            const expense = parseFloat(document.getElementById('expenseInput').value) || 0;
            const budget = budgetSettings[category] || 0;
            if (expense <= 0 || !date) return;
            
            const newEntry = { id: Date.now(), date, category, budget, expense };
            entries.push(newEntry);
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            saveToLocalStorage();
            renderEntries();
            updateSummary();
            document.getElementById('expenseInput').value = '';
            
            // 如果已串接 Google 則自動寫入一筆
            appendToSheet(newEntry);
        }

        function renderEntries() {
            const container = document.getElementById('entriesContainer');
            if (!container) return;
            container.innerHTML = '';
            if (entries.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-sm py-10 italic">筆記本目前是空的，寫點什麼吧...</p>`;
                return;
            }
            let currentDate = null;
            entries.forEach(e => {
                if (e.date !== currentDate) {
                    currentDate = e.date;
                    const dayTotal = entries.filter(item => item.date === currentDate).reduce((sum, item) => sum + item.expense, 0);
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = `📅 ${currentDate} <span class="ml-2 text-[10px] bg-white px-2 py-0.5 rounded-full border border-green-200">今日花費: $${dayTotal}</span>`;
                    container.appendChild(divider);
                }
                const currentBudget = budgetSettings[e.category] !== undefined ? budgetSettings[e.category] : e.budget;
                const rem = currentBudget - e.expense;
                const div = document.createElement('div');
                div.className = 'card p-4 flex justify-between items-center bg-white border-l-8 mb-2';
                div.style.borderLeftColor = rem >= 0 ? '#98ba7d' : '#d35400';
                div.innerHTML = `
                    <div class="flex-1">
                        <div class="font-bold text-sm">${e.category} <span class="text-[10px] font-normal opacity-50">預算: $${currentBudget}</span></div>
                        <div class="text-xs">費用: $${e.expense} | <span class="${rem>=0?'text-green-600':'text-red-600'}">${rem>=0?'剩餘':'超支'}: $${Math.abs(rem)}</span></div>
                    </div>
                    <button onclick="deleteEntry(${e.id})" class="text-gray-300 hover:text-red-400 px-2 text-sm">✕</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            saveToLocalStorage();
            renderEntries();
            updateSummary();
        }

        function updateSummary() {
            let exp = 0, totalRem = 0;
            entries.forEach(e => {
                exp += e.expense;
                const currentBudget = budgetSettings[e.category] !== undefined ? budgetSettings[e.category] : e.budget;
                totalRem += (currentBudget - e.expense);
            });
            const expEl = document.getElementById('totalExpense');
            const remEl = document.getElementById('totalRemaining');
            if (expEl) expEl.innerText = `$ ${exp}`;
            if (remEl) remEl.innerText = `$ ${totalRem}`;
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryListContainer');
            if (!container) return;
            container.innerHTML = '';
            Object.keys(budgetSettings).forEach(cat => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-50 p-2 rounded border border-transparent';
                div.innerHTML = `
                    <span class="text-xs">${cat}</span>
                    <div class="flex items-center gap-1">
                        <input type="number" value="${budgetSettings[cat]}" onchange="updateBudgetValue('${cat}', this.value)" class="w-12 bg-transparent text-xs text-right font-bold text-green-700">
                        <button onclick="removeCategory('${cat}')" class="text-gray-300 hover:text-red-400 text-xs ml-1">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateBudgetValue(name, value) {
            budgetSettings[name] = parseFloat(value) || 0;
            saveToLocalStorage();
        }

        function removeCategory(name) {
            if (Object.keys(budgetSettings).length <= 1) return;
            delete budgetSettings[name];
            saveToLocalStorage();
            renderCategoryList();
            updateCategorySelect();
        }

        async function askAiForSuggestion() {
            const area = document.getElementById('aiMessageArea');
            if (!area) return;
            area.classList.remove('hidden');
            area.innerText = "正在為您占卜理財運勢...";
            
            const prompt = `目前的財務概況如下：總支出 ${document.getElementById('totalExpense').innerText}。請給予溫馨的吉卜力風格理財建議（50字以內）。`;
            try {
                if (!geminiApiKey) {
                    area.innerText = "請先設定 Gemini API Key 才能取得 AI 建議唷。";
                    return;
                }
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: "你是一位溫馨的吉卜力風格財務助理。請給予精簡、溫暖、具有詩意的中文理財建議。" }] }
                    })
                });
                const result = await response.json();
                area.innerText = result.candidates?.[0]?.content?.parts?.[0]?.text || "森林的訊號不太穩定...";
            } catch(e) { area.innerText = "森林的訊號不太穩定，請稍後再試。"; }
        }
    </script>
</body>
</html>
