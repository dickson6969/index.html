<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓之帳本 - 喵嗚記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cat-orange: #ffb347;
            --cat-cream: #fff5e6;
            --cat-gray: #b0a491;
            --cat-pink: #ffcfdf;
            --cat-brown: #5d4037;
        }

        body {
            background-color: var(--cat-cream);
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--cat-brown);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 179, 71, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 207, 223, 0.2) 0%, transparent 25%);
            min-height: 100vh;
        }

        .cat-ears::before, .cat-ears::after {
            content: '▲';
            position: absolute;
            top: -15px;
            font-size: 20px;
            color: var(--cat-orange);
        }
        .cat-ears::before { left: 20px; transform: rotate(-10deg); }
        .cat-ears::after { right: 20px; transform: rotate(10deg); }

        .cute-font { font-family: 'ZCOOL KuaiLe', cursive; }

        .card {
            background: white;
            border: 3px solid var(--cat-orange);
            border-radius: 25px;
            box-shadow: 0 8px 0px rgba(255, 179, 71, 0.1);
            position: relative;
        }

        .btn-primary {
            background-color: var(--cat-orange);
            color: white;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: bold;
            box-shadow: 0 4px 0px #e6952d;
        }

        .btn-google {
            background-color: white;
            color: #444;
            border: 1px solid #ddd;
            border-radius: 50px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-google:active { transform: scale(0.98); background-color: #f8f8f8; }

        .input-field {
            border: 2px solid var(--cat-pink);
            border-radius: 12px;
            padding: 8px 12px;
            outline: none;
            width: 100%;
        }

        .summary-box {
            background: #fff9c4;
            border: 2px dashed var(--cat-orange);
            border-radius: 20px;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .date-divider {
            display: flex;
            align-items: center;
            margin: 20px 0 10px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .date-divider::after {
            content: " 🐾 🐾 🐾";
            margin-left: 10px;
            color: var(--cat-pink);
            letter-spacing: 5px;
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto relative">
        <button onclick="toggleSettings(true)" class="absolute top-0 right-0 p-2 text-gray-500 z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke-width="2"/>
            </svg>
        </button>

        <div class="text-center mb-8">
            <h1 class="text-4xl cute-font text-orange-600 mb-2">🐱 貓之帳本 🐱</h1>
            <p class="text-sm opacity-75">和貓咪一起守護你的小錢包</p>
        </div>

        <div class="card p-6 mb-6 cat-ears">
            <h2 class="text-xl cute-font mb-4">🐈 捕捉一筆開銷</h2>
            <div class="space-y-4">
                <input type="date" id="entryDate" class="input-field text-sm">
                <div class="grid grid-cols-2 gap-4">
                    <select id="categorySelect" class="input-field bg-white text-sm" onchange="handleCategoryChange()"></select>
                    <input type="number" id="currentBudgetDisplay" class="input-field text-sm" disabled>
                </div>
                <input type="number" id="expenseInput" placeholder="今天花了多少錢？" class="input-field">
                <button onclick="addEntry()" class="w-full btn-primary text-lg">喵！紀錄完成</button>
            </div>
        </div>

        <div id="entriesContainer" class="space-y-4 mb-8"></div>

        <div class="summary-box p-6 text-center">
            <h2 class="cute-font text-2xl mb-4">🐟 支出結算 🐟</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <p class="text-xs text-gray-600">今日支出</p>
                    <p id="totalExpense" class="text-2xl font-bold text-orange-600">$ 0</p>
                </div>
                <div>
                    <p class="text-xs text-gray-600">剩餘預算</p>
                    <p id="totalRemaining" class="text-2xl font-bold text-gray-700">$ 0</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 設定彈窗 -->
    <div id="settingsModal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
        <div class="card w-full max-w-sm p-5 relative overflow-y-auto max-h-[90vh]">
            <button onclick="toggleSettings(false)" class="absolute top-4 right-4 text-gray-400">✕</button>
            <h2 class="text-xl cute-font mb-4 text-orange-600">⚙️ 貓窩配置</h2>
            
            <div class="mb-6 bg-orange-50 p-4 rounded-2xl border border-orange-100">
                <h3 class="text-sm font-bold mb-2">☁️ 雲端貓爪同步</h3>
                <p id="googleStatus" class="text-[10px] text-orange-600 mb-3 italic">正在準備同步工具...</p>
                <div class="flex flex-col gap-2">
                    <button id="authorize_button" onclick="handleAuthClick()" class="btn-google">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4"> 點此嘗試連結 Google
                    </button>
                    <button id="sync_button" onclick="syncAllToSheet()" class="hidden btn-primary text-xs py-2">
                        立即同步數據至試算表
                    </button>
                    <button id="signout_button" onclick="handleSignoutClick()" class="hidden text-[10px] text-gray-400 underline">登出連結</button>
                </div>
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <p class="text-[10px] text-gray-400 uppercase">新增項目</p>
                    <div class="flex gap-2">
                        <input type="text" id="newItemName" placeholder="項目名" class="flex-[1.5] input-field text-[11px]">
                        <input type="number" id="newItemBudget" placeholder="預算" class="flex-1 input-field text-[11px]">
                        <button onclick="addNewCategory()" class="btn-primary text-[11px] px-3">新增</button>
                    </div>
                </div>
                <div id="categoryListContainer" class="max-h-40 overflow-y-auto space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '280549729141-o2fip1qnfv5a2pbpk7pdasep306t5s6h.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyCJ6HWrynMRa75NnD3DIDIjXt1DoWgwe6I';
        const DISCOVERY_DOC = 'https://sheets.googleapis.com/$discovery/rest?version=v4';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let spreadsheetId = localStorage.getItem('ghibli_spreadsheet_id');

        const defaultBudgets = { "🍱 午餐": 120, "☕ 下午茶": 80, "🚌 交通": 60, "🛍️ 購物": 500 };
        let budgetSettings = JSON.parse(localStorage.getItem('ghibli_budgets')) || defaultBudgets;
        let entries = JSON.parse(localStorage.getItem('ghibli_entries')) || [];

        // 核心：將初始化函數掛載到全域 Window 物件上，確保加載時能找到
        window.gapiLoaded = function() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: [DISCOVERY_DOC],
                });
                gapiInited = true;
                maybeEnableButtons();
            });
        };

        window.gisLoaded = function() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // 在呼叫 requestAccessToken 時定義
            });
            gisInited = true;
            maybeEnableButtons();
        };

        function maybeEnableButtons() {
            if (gapiInited && gisInited) {
                const statusEl = document.getElementById('googleStatus');
                if (statusEl) {
                    statusEl.innerText = "✅ 貓咪已就緒，可以點擊連結";
                    statusEl.classList.add('text-green-600');
                }
                // 檢查是否已有 Token
                const savedToken = localStorage.getItem('google_access_token');
                if (savedToken) {
                    gapi.client.setToken(JSON.parse(savedToken));
                    updateSigninStatus(true);
                }
            }
        }

        function handleAuthClick() {
            tokenClient.callback = async (resp) => {
                if (resp.error !== undefined) throw (resp);
                localStorage.setItem('google_access_token', JSON.stringify(gapi.client.getToken()));
                updateSigninStatus(true);
                await initializeSpreadsheet();
            };

            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }

        function handleSignoutClick() {
            const token = gapi.client.getToken();
            if (token !== null) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
                localStorage.removeItem('google_access_token');
                localStorage.removeItem('ghibli_spreadsheet_id');
                spreadsheetId = null;
                updateSigninStatus(false);
            }
        }

        function updateSigninStatus(isSignedIn) {
            const authBtn = document.getElementById('authorize_button');
            const signoutBtn = document.getElementById('signout_button');
            const syncBtn = document.getElementById('sync_button');
            const statusEl = document.getElementById('googleStatus');

            if (authBtn) authBtn.classList.toggle('hidden', isSignedIn);
            if (signoutBtn) signoutBtn.classList.toggle('hidden', !isSignedIn);
            if (syncBtn) syncBtn.classList.toggle('hidden', !isSignedIn);
            if (statusEl) statusEl.innerText = isSignedIn ? "✅ 雲端同步已開啟" : "尚未連結 Google 帳號";
        }

        async function initializeSpreadsheet() {
            if (spreadsheetId) return;
            try {
                const response = await gapi.client.sheets.spreadsheets.create({
                    resource: { properties: { title: '貓之帳本_備份' } }
                });
                spreadsheetId = response.result.spreadsheetId;
                localStorage.setItem('ghibli_spreadsheet_id', spreadsheetId);
                await gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId, range: 'Sheet1!A1:D1', valueInputOption: 'RAW',
                    resource: { values: [['日期', '項目', '預算', '花費']] }
                });
            } catch (err) { console.error("建立失敗", err); }
        }

        async function syncAllToSheet() {
            const btn = document.getElementById('sync_button');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "🐾 搬運中...";
            try {
                await initializeSpreadsheet();
                const values = entries.map(e => [e.date, e.category, e.budget, e.expense]);
                await gapi.client.sheets.spreadsheets.values.clear({ spreadsheetId, range: 'Sheet1!A2:D1000' });
                if (values.length > 0) {
                    await gapi.client.sheets.spreadsheets.values.update({
                        spreadsheetId, range: 'Sheet1!A2', valueInputOption: 'RAW',
                        resource: { values: values }
                    });
                }
                btn.innerText = "同步成功！✨";
                setTimeout(() => { btn.innerText = originalText; btn.disabled = false; }, 2000);
            } catch (err) {
                console.error(err);
                btn.innerText = "同步出錯";
                btn.disabled = false;
            }
        }

        // --- 記帳邏輯 ---
        function updateCategorySelect() {
            const select = document.getElementById('categorySelect');
            if (!select) return;
            select.innerHTML = '';
            Object.keys(budgetSettings).forEach(cat => {
                const opt = document.createElement('option');
                opt.value = opt.text = cat;
                select.appendChild(opt);
            });
            handleCategoryChange();
        }

        function handleCategoryChange() {
            const select = document.getElementById('categorySelect');
            const display = document.getElementById('currentBudgetDisplay');
            if (select && display) {
                display.value = budgetSettings[select.value] || 0;
            }
        }

        function addEntry() {
            const date = document.getElementById('entryDate').value;
            const category = document.getElementById('categorySelect').value;
            const expense = parseFloat(document.getElementById('expenseInput').value) || 0;
            if (expense <= 0 || !date) return;
            entries.push({ id: Date.now(), date, category, budget: budgetSettings[category], expense });
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('ghibli_entries', JSON.stringify(entries));
            renderEntries(); updateSummary();
            document.getElementById('expenseInput').value = '';
        }

        function renderEntries() {
            const container = document.getElementById('entriesContainer');
            if (!container) return;
            container.innerHTML = '';
            let lastDate = '';
            entries.forEach(e => {
                if (e.date !== lastDate) {
                    lastDate = e.date;
                    const div = document.createElement('div');
                    div.className = 'date-divider';
                    div.innerText = `🐈 ${e.date}`;
                    container.appendChild(div);
                }
                const div = document.createElement('div');
                div.className = 'card p-4 flex justify-between bg-white border-l-8 mb-2';
                div.style.borderLeftColor = (e.budget - e.expense >= 0) ? '#ffb347' : '#ffcfdf';
                div.innerHTML = `<div><div class="font-bold">${e.category}</div><div class="text-xs">花費 $${e.expense} / 預算 $${e.budget}</div></div>
                                 <button onclick="deleteEntry(${e.id})" class="text-gray-300">✕</button>`;
                container.appendChild(div);
            });
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            localStorage.setItem('ghibli_entries', JSON.stringify(entries));
            renderEntries(); updateSummary();
        }

        function updateSummary() {
            const total = entries.reduce((s, e) => s + e.expense, 0);
            document.getElementById('totalExpense').innerText = `$ ${total}`;
            const totalBudget = Object.values(budgetSettings).reduce((s, b) => s + b, 0);
            document.getElementById('totalRemaining').innerText = `$ ${totalBudget - total}`;
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if (modal) modal.classList.toggle('hidden', !show);
            if (show) renderCategoryList();
        }

        function addNewCategory() {
            const name = document.getElementById('newItemName').value.trim();
            const budget = parseFloat(document.getElementById('newItemBudget').value) || 0;
            if (name) {
                budgetSettings[name] = budget;
                localStorage.setItem('ghibli_budgets', JSON.stringify(budgetSettings));
                renderCategoryList(); updateCategorySelect();
            }
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryListContainer');
            if (!container) return;
            container.innerHTML = '';
            Object.keys(budgetSettings).forEach(cat => {
                const div = document.createElement('div');
                div.className = 'flex justify-between text-xs bg-orange-50 p-2 rounded';
                div.innerHTML = `<span>${cat} ($${budgetSettings[cat]})</span><button onclick="deleteCategory('${cat}')">✕</button>`;
                container.appendChild(div);
            });
        }

        function deleteCategory(name) {
            delete budgetSettings[name];
            localStorage.setItem('ghibli_budgets', JSON.stringify(budgetSettings));
            renderCategoryList(); updateCategorySelect();
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
            updateCategorySelect();
            renderEntries();
            updateSummary();
        });
    </script>
    
    <!-- 確保 onload 指向的函數已定義在 window 上 -->
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
